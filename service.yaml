apiVersion: v1
kind: Service
metadata:
  name: my-python-app-service
spec:
  type: LoadBalancer
  selector:
    app: my-python-app # Must match the 'app' label of the Pods in your Deployment
  ports:
  - protocol: TCP
    port: 80 # The port the LoadBalancer will listen on 
    targetPort: 8080 # The port on your Pods/containers to forward traffic to 